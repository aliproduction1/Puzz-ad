<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Puzzlia Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1230;color:#eef;font:15px system-ui,sans-serif}.wrap{max-width:720px;margin:0 auto;padding:14px}h1{font-size:20px}.panel{background:#171d4a;border:1px solid #333a7a;border-radius:16px;padding:16px;margin:12px 0}.hidden{display:none!important}
.btn{background:#6fe3ff;color:#0a1030;border:0;border-radius:11px;padding:11px 14px;font-weight:800;cursor:pointer}.btn.small{padding:8px 11px;font-size:12px}.btn.secondary{background:#2b3270;color:#fff}.wide2{width:100%;margin-top:8px}
.field,.fl{display:block;margin:10px 0;font-size:12px;color:#aab}.field input,.fl input,.fl select{display:block;width:100%;margin-top:4px;padding:11px;border-radius:10px;border:1px solid #3a4290;background:#0b1030;color:#fff;font:inherit}
.row2{display:flex;gap:8px}.row2>*{flex:1}.card{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#212860;border:1px solid #333a7a;border-radius:12px;padding:12px;margin:8px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{padding:8px 11px;border-radius:10px;background:#2b3270;color:#fff;border:0;font-weight:800;font-size:12px}.tabs button.on{background:#6fe3ff;color:#0a1030}
.pill2{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#ffffff22}.st-pending{background:#c9a227;color:#222}.st-approved{background:#2fa84f}.st-rejected{background:#c0392b}.small{font-size:12px}.muted{color:#aab}.good{color:#6fe3ff}
pre.rules{white-space:pre-wrap;word-break:break-all;background:#0007;padding:10px;border-radius:10px;font-size:11px;max-height:340px;overflow:auto}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#6fe3ff;color:#0a1030;font-weight:800;padding:11px 18px;border-radius:14px}</style></head><body><div class="wrap"><h1>🛠 Puzzlia Admin</h1>
<section class="panel" id="aLogin"><div class="field"><label>Firebase admin email</label><input id="aEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="aPass" type="password" autocomplete="current-password"></div><div class="field"><label>Admin UID</label><input id="aUid"></div><button class="btn wide2" onclick="adminLogin()">LOGIN</button><p class="small muted" id="aMsg"></p></section>
<section class="panel hidden" id="aPanel"><div class="row2" style="align-items:center"><b>Admin Panel</b><button class="btn small secondary" style="flex:0 0 auto" onclick="adminLogout()">LOGOUT</button></div><div class="tabs" id="aTabs"></div><div id="aBody"></div></section></div>
<script>
/* Fill the SAME Firebase config as index.html */
const APP_CONFIG={firebase:{apiKey:"PASTE_FIREBASE_WEB_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",databaseURL:"https://YOUR_PROJECT-default-rtdb.firebaseio.com",projectId:"YOUR_PROJECT_ID",appId:"YOUR_FIREBASE_APP_ID"},telegramBotUsername:"YOUR_TELEGRAM_BOT_USERNAME",adminEmail:"admin@example.com",adminUid:""};
const ADS_DEFAULT={order:'monetag,adsgram',startup:1,levelEvery:1,monetag:{enabled:1,zone:''},adsgram:{enabled:1,blockInter:'',blockReward:''},adsterra:{enabled:0,bannerHtml:''}};
const CFG_DEF={coin:'PUZZ',rates:{GRAM:{puzz:1000,amt:1},TON:{puzz:10000,amt:1}},minWithdraw:1000,minRefs:3,reward:{levelCoin:5,adCoin:10,adCooldown:30,adDaily:20},ref:{per:50,b3:100,b10:500,b100:5000},ads:ADS_DEFAULT,tasks:{t1:{title:'Join our Telegram channel',kind:'link',url:'https://t.me/',reward:50,limit:0},t2:{title:'Watch a sponsored video',kind:'ad',url:'',reward:10,limit:10}}};

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dget=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
function merge(a,b){if(b==null)return a;if(typeof a!=='object'||a===null||Array.isArray(a)||typeof b!=='object')return b;const o={...a};for(const k in b)o[k]=merge(a[k],b[k]);return o}
const nfmt=n=>(+n||0).toLocaleString(undefined,{maximumFractionDigits:6});
let CFG=CFG_DEF;const coin=()=>CFG.coin||'PUZZ';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1600)}
if(typeof firebase==='undefined'||/PASTE|YOUR_/.test(APP_CONFIG.firebase.apiKey)){$('aMsg').textContent='Firebase is not configured. Fill APP_CONFIG.'}
else{var AD,AUTH;firebase.initializeApp(APP_CONFIG.firebase);AD=firebase.database();AUTH=firebase.auth();
let first=true;AD.ref('config').on('value',s=>{CFG=merge(CFG_DEF,s.val()||{});if(first){first=false;renderAdmin()}});
AUTH.onAuthStateChanged(async u=>{adminOn=false;if(u){try{adminOn=(await AD.ref('admins/'+u.uid).once('value')).val()===true&&(!APP_CONFIG.adminUid||u.uid===APP_CONFIG.adminUid)}catch(e){}}renderAdmin()})}
/* ---------------- ADMIN (separate Firebase app → user session untouched) ---------------- */
let adminOn=false,aTab='withdrawals';
const ADMIN_RULES="{\n \"rules\": {\n  \".read\": false,\n  \".write\": false,\n  \"admins\": {\n   \"$a\": {\n    \".read\": \"auth!=null && auth.uid===$a\",\n    \".write\": false\n   }\n  },\n  \"config\": {\n   \".read\": true,\n   \".write\": \"auth!=null && root.child('admins').child(auth.uid).val()===true\"\n  },\n  \"users\": {\n   \".read\": \"auth!=null && root.child('admins').child(auth.uid).val()===true\",\n   \".indexOn\": [\n    \"balance\"\n   ],\n   \"$u\": {\n    \".read\": \"auth!=null && auth.uid===$u\",\n    \".write\": \"auth!=null && (auth.uid===$u || root.child('admins').child(auth.uid).val()===true)\",\n    \".validate\": \"newData.hasChildren(['balance','earned'])\",\n    \"balance\": {\n     \".validate\": \"newData.isNumber() && newData.val()>=0 && (root.child('admins').child(auth.uid).val()===true || !data.exists() || newData.val() <= data.val() + (newData.parent().child('earned').val() - data.parent().child('earned').val()))\"\n    },\n    \"earned\": {\n     \".validate\": \"newData.isNumber() && newData.val()>=0 && (!data.exists() || newData.val()>=data.val()) && newData.val()<=100000 + (data.exists() ? data.val() : 0)\"\n    },\n    \"refCredited\": {\n     \".validate\": \"newData.isNumber() && newData.val()>=0 && (!data.exists() || newData.val()>=data.val())\"\n    },\n    \"refEarned\": {\n     \".validate\": \"newData.isNumber() && newData.val()>=0 && (!data.exists() || newData.val()>=data.val())\"\n    },\n    \"name\": {\n     \".validate\": \"newData.isString() && newData.val().length<=100\"\n    },\n    \"tg\": {\n     \".validate\": \"newData.isNumber()\"\n    },\n    \"createdAt\": {\n     \".validate\": \"newData.isNumber() && (!data.exists() || newData.val()===data.val())\"\n    },\n    \"refBy\": {\n     \".validate\": \"newData.isString() && newData.val().length<=128 && ((data.exists() && newData.val()===data.val()) || !data.parent().exists())\"\n    },\n    \"tasks\": {\n     \"$t\": {\n      \".validate\": \"newData.hasChildren(['d','n','t'])\",\n      \"d\": {\n       \".validate\": \"newData.isString()\"\n      },\n      \"n\": {\n       \".validate\": \"newData.isNumber() && newData.val()>=0\"\n      },\n      \"t\": {\n       \".validate\": \"newData.isNumber() && newData.val()>=0\"\n      },\n      \"$o\": {\n       \".validate\": false\n      }\n     }\n    },\n    \"ad\": {\n     \"d\": {\n      \".validate\": \"newData.isString()\"\n     },\n     \"n\": {\n      \".validate\": \"newData.isNumber() && newData.val()>=0\"\n     },\n     \"last\": {\n      \".validate\": \"newData.isNumber()\"\n     },\n     \"$o\": {\n      \".validate\": false\n     }\n    },\n    \"$other\": {\n     \".validate\": false\n    }\n   }\n  },\n  \"referrals\": {\n   \"$r\": {\n    \".read\": \"auth!=null && (auth.uid===$r || root.child('admins').child(auth.uid).val()===true)\",\n    \"$n\": {\n     \".write\": \"auth!=null && auth.uid===$n && !data.exists() && $r!==auth.uid && root.child('users').child(auth.uid).child('refBy').val()===$r\",\n     \".validate\": \"newData.hasChildren(['name','ts'])\",\n     \"name\": {\n      \".validate\": \"newData.isString() && newData.val().length<=100\"\n     },\n     \"ts\": {\n      \".validate\": \"newData.isNumber()\"\n     },\n     \"$other\": {\n      \".validate\": false\n     }\n    }\n   }\n  },\n  \"withdrawals\": {\n   \".read\": \"auth!=null && root.child('admins').child(auth.uid).val()===true\",\n   \"$w\": {\n    \".validate\": \"newData.hasChildren(['uid','amount','network','receive','address','status','ts'])\",\n    \"uid\": {\n     \".validate\": \"newData.isString() && (newData.val()===auth.uid || root.child('admins').child(auth.uid).val()===true)\"\n    },\n    \"name\": {\n     \".validate\": \"newData.isString() && newData.val().length<=100\"\n    },\n    \"tg\": {\n     \".validate\": \"newData.isNumber()\"\n    },\n    \"amount\": {\n     \".validate\": \"newData.isNumber() && newData.val()>0\"\n    },\n    \"network\": {\n     \".validate\": \"newData.val()==='GRAM' || newData.val()==='TON'\"\n    },\n    \"receive\": {\n     \".validate\": \"newData.isNumber() && newData.val()>=0\"\n    },\n    \"address\": {\n     \".validate\": \"newData.isString() && newData.val().length>=10 && newData.val().length<=200\"\n    },\n    \"memo\": {\n     \".validate\": \"newData.isString() && newData.val().length<=200\"\n    },\n    \"status\": {\n     \".validate\": \"newData.val()==='pending' || ((root.child('admins').child(auth.uid).val()===true) && (newData.val()==='approved' || newData.val()==='rejected'))\"\n    },\n    \"ts\": {\n     \".validate\": \"newData.isNumber()\"\n    },\n    \"$other\": {\n     \".validate\": false\n    },\n    \".write\": \"auth!=null && ((!data.exists() && newData.child('uid').val()===auth.uid) || root.child('admins').child(auth.uid).val()===true)\"\n   }\n  },\n  \"userWithdrawals\": {\n   \"$u\": {\n    \".read\": \"auth!=null && auth.uid===$u\",\n    \"$w\": {\n     \".validate\": \"newData.hasChildren(['uid','amount','network','receive','address','status','ts'])\",\n     \"uid\": {\n      \".validate\": \"newData.isString() && (newData.val()===auth.uid || root.child('admins').child(auth.uid).val()===true)\"\n     },\n     \"name\": {\n      \".validate\": \"newData.isString() && newData.val().length<=100\"\n     },\n     \"tg\": {\n      \".validate\": \"newData.isNumber()\"\n     },\n     \"amount\": {\n      \".validate\": \"newData.isNumber() && newData.val()>0\"\n     },\n     \"network\": {\n      \".validate\": \"newData.val()==='GRAM' || newData.val()==='TON'\"\n     },\n     \"receive\": {\n      \".validate\": \"newData.isNumber() && newData.val()>=0\"\n     },\n     \"address\": {\n      \".validate\": \"newData.isString() && newData.val().length>=10 && newData.val().length<=200\"\n     },\n     \"memo\": {\n      \".validate\": \"newData.isString() && newData.val().length<=200\"\n     },\n     \"status\": {\n      \".validate\": \"newData.val()==='pending' || ((root.child('admins').child(auth.uid).val()===true) && (newData.val()==='approved' || newData.val()==='rejected'))\"\n     },\n     \"ts\": {\n      \".validate\": \"newData.isNumber()\"\n     },\n     \"$other\": {\n      \".validate\": false\n     },\n     \".write\": \"auth!=null && ((auth.uid===$u && !data.exists()) || root.child('admins').child(auth.uid).val()===true)\"\n    }\n   }\n  },\n  \"notifications\": {\n   \"$u\": {\n    \".read\": \"auth!=null && auth.uid===$u\",\n    \"$n\": {\n     \".write\": \"auth!=null && root.child('admins').child(auth.uid).val()===true\",\n     \"seen\": {\n      \".write\": \"auth!=null && auth.uid===$u && data.parent().exists()\",\n      \".validate\": \"newData.isBoolean()\"\n     },\n     \"text\": {\n      \".validate\": \"newData.isString() && newData.val().length<=300\"\n     },\n     \"ts\": {\n      \".validate\": \"newData.isNumber()\"\n     }\n    }\n   }\n  }\n }\n}";
function adminLogin(){const e=$('aEmail').value.trim(),p=$('aPass').value,id=$('aUid').value.trim();$('aMsg').textContent='Signing in…';AUTH.signInWithEmailAndPassword(e,p).then(async c=>{const u=c.user,badMail=APP_CONFIG.adminEmail!=='admin@example.com'&&u.email!==APP_CONFIG.adminEmail;if(u.uid!==id||badMail||(APP_CONFIG.adminUid&&u.uid!==APP_CONFIG.adminUid)){await AUTH.signOut();$('aMsg').textContent='Email / UID does not match the admin account.';return}const av=(await AD.ref('admins/'+u.uid).once('value')).val();if(av!==true){await AUTH.signOut();$('aMsg').textContent='Not an admin. Database returned '+JSON.stringify(av)+' at admins/'+u.uid+' (must be boolean true).';return}$('aPass').value='';$('aMsg').textContent=''}).catch(er=>$('aMsg').textContent=er.message)}
function adminLogout(){AUTH.signOut()}
const AF={rewards:[['minWithdraw','Minimum withdrawal (PUZZ)'],['minRefs','Referrals required to withdraw'],['reward.levelCoin','Coins per level complete'],['reward.adCoin','Coins per watched video ad'],['reward.adCooldown','Ad cooldown (seconds)'],['reward.adDaily','Daily ad limit (0 = unlimited)'],['ref.per','Coins per 1 referral'],['ref.b3','Bonus for every 3 referrals'],['ref.b10','Bonus for every 10 referrals'],['ref.b100','Bonus for every 100 referrals'],['rates.GRAM.puzz','GRAM rate: PUZZ amount'],['rates.GRAM.amt','…equals GRAM'],['rates.TON.puzz','TON rate: PUZZ amount'],['rates.TON.amt','…equals TON']],ads:[['ads.order','Network order (comma): monetag,adsgram','t'],['ads.startup','Video ad on app open (1/0)'],['ads.levelEvery','Interstitial every N levels'],['ads.monetag.enabled','Monetag enabled (1/0)'],['ads.monetag.zone','Monetag Zone ID','t'],['ads.adsgram.enabled','Adsgram enabled (1/0)'],['ads.adsgram.blockInter','Adsgram Interstitial Block ID','t'],['ads.adsgram.blockReward','Adsgram Rewarded Block ID','t'],['ads.adsterra.enabled','Adsterra banners enabled (1/0)'],['ads.adsterra.bannerHtml','Adsterra banner HTML snippet','t']]};
function renderAdmin(){const L=$('aLogin'),P=$('aPanel');if(!L)return;L.classList.toggle('hidden',adminOn);P.classList.toggle('hidden',!adminOn);if(!adminOn)return;
 $('aTabs').innerHTML=[['withdrawals','Withdrawals'],['rewards','Rewards & Rates'],['tasks','Tasks'],['ads','Ads'],['users','Users'],['rules','DB Rules']].map(([k,l])=>`<button class="${k===aTab?'on':''}" onclick="aTab='${k}';renderAdmin()">${l}</button>`).join('');const B=$('aBody');
 if(aTab==='rewards'||aTab==='ads')B.innerHTML=AF[aTab].map(([p,l,t])=>`<label class="fl">${l}<input data-p="${p}" data-t="${t||'n'}" value="${esc(dget(CFG,p)??'')}"></label>`).join('')+`<button class="btn wide2" onclick="saveFields()">SAVE</button>`;
 else if(aTab==='tasks'){B.innerHTML=Object.entries(CFG.tasks||{}).map(([id,t])=>taskForm(id,t)).join('')+'<h4>➕ New task</h4>'+taskForm('new',{title:'',kind:'link',url:'',reward:10,limit:0})}
 else if(aTab==='users'){B.textContent='Loading…';AD.ref('users').orderByChild('balance').limitToLast(30).once('value').then(s=>{const a=[];s.forEach(c=>a.unshift([c.key,c.val()]));B.innerHTML=a.map(([k,u])=>`<div class="card"><div><b>${esc(u.name||'?')}</b> <span class="small muted">tg:${u.tg||'-'}</span><div class="small muted">${k}</div></div><b>${nfmt(u.balance)}</b></div>`).join('')||'No users.'})}
 else if(aTab==='rules')B.innerHTML='<p class="small muted">Firebase Console → Realtime Database → Rules → paste, publish. Also add  <b>admins/YOUR_ADMIN_UID = true</b>  and enable Anonymous + Email/Password sign-in.</p><pre class="rules">'+esc(ADMIN_RULES)+'</pre>';
 else{B.textContent='Loading…';AD.ref('withdrawals').off('value');AD.ref('withdrawals').limitToLast(60).on('value',s=>{if(aTab!=='withdrawals')return;const a=[];s.forEach(c=>a.unshift([c.key,c.val()]));a.sort((x,y)=>(x[1].status==='pending'?0:1)-(y[1].status==='pending'?0:1));B.innerHTML=a.map(([id,w])=>`<div class="card" style="display:block"><div><b>${nfmt(w.amount)} ${coin()} → ${nfmt(w.receive)} ${w.network}</b> <span class="pill2 st-${w.status}">${w.status.toUpperCase()}</span></div><div class="small muted">${esc(w.name)} • tg:${w.tg} • ${new Date(w.ts).toLocaleString()}</div><div class="small" style="word-break:break-all">Addr: ${esc(w.address)}<br>Memo: ${esc(w.memo||'-')}</div>${w.status==='pending'?`<div class="row2" style="margin-top:8px"><button class="btn small" onclick="reviewW('${id}',1)">✓ APPROVE</button><button class="btn small secondary" onclick="reviewW('${id}',0)">✕ REJECT</button></div>`:''}</div>`).join('')||'No requests.'})}}
function taskForm(id,t){return `<div class="card" style="display:block" data-tid="${esc(id)}"><label class="fl">Title<input class="tt" value="${esc(t.title)}"></label><div class="row2"><label class="fl">Type<select class="tk"><option value="link" ${t.kind==='link'?'selected':''}>Link task</option><option value="ad" ${t.kind==='ad'?'selected':''}>Video ad</option></select></label><label class="fl">Reward (coins)<input class="tr" type="number" value="${t.reward}"></label><label class="fl">Daily limit<input class="tl" type="number" value="${t.limit||0}"></label></div><label class="fl">URL (link tasks)<input class="tu" value="${esc(t.url||'')}"></label><div class="row2"><button class="btn small" onclick="saveTask(this)">SAVE</button>${id==='new'?'':'<button class="btn small secondary" onclick="delTask(\''+esc(id)+'\')">DELETE</button>'}</div></div>`}
async function saveTask(b){const c=b.closest('[data-tid]'),id=c.dataset.tid==='new'?'t'+Date.now():c.dataset.tid,v={title:c.querySelector('.tt').value.trim(),kind:c.querySelector('.tk').value,url:c.querySelector('.tu').value.trim(),reward:Math.max(0,+c.querySelector('.tr').value||0),limit:Math.max(0,+c.querySelector('.tl').value||0)};if(!v.title)return alert('Title required');await AD.ref('config/tasks/'+id).set(v);toast('Saved ✓');setTimeout(renderAdmin,400)}
async function delTask(id){if(!confirm('Delete task?'))return;await AD.ref('config/tasks/'+id).remove();setTimeout(renderAdmin,400)}
async function saveFields(){const u={};document.querySelectorAll('#aBody [data-p]').forEach(i=>{const n=i.dataset.t==='n',v=n?Number(i.value):i.value.trim();if(n&&(!Number.isFinite(v)||v<0))return;u['config/'+i.dataset.p.replace(/\./g,'/')]=v});await AD.ref().update(u);toast('Saved ✓')}
async function reviewW(id,ok){const s=await AD.ref('withdrawals/'+id).once('value'),w=s.val();if(!w||w.status!=='pending')return;const st=ok?'approved':'rejected',nid=AD.ref('notifications/'+w.uid).push().key,txt=ok?`✅ Your withdrawal of ${nfmt(w.amount)} ${coin()} (${nfmt(w.receive)} ${w.network}) was approved.`:`❌ Your withdrawal of ${nfmt(w.amount)} ${coin()} was rejected and refunded.`;
 await AD.ref().update({['withdrawals/'+id+'/status']:st,['userWithdrawals/'+w.uid+'/'+id+'/status']:st,['notifications/'+w.uid+'/'+nid]:{text:txt,ts:firebase.database.ServerValue.TIMESTAMP,seen:false}});if(!ok)await AD.ref('users/'+w.uid+'/balance').transaction(v=>(v||0)+w.amount);toast('Done ✓')}

</script></body></html>
